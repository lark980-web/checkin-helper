plugins {
    id 'com.android.application'
}

android {
    namespace 'com.checkin.helper'
    compileSdk 34

    defaultConfig {
        applicationId "com.checkin.helper"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
